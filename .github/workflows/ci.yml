name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend install
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg sidecars
        # required: externalBin sidecars must exist for cargo build/test to succeed
        run: bash scripts/fetch-ffmpeg.sh

      - name: Frontend lint & test
        run: |
          pnpm build
          pnpm vitest run

      - name: Point tests at fetched ffmpeg sidecars
        shell: bash
        # cargo test runs from src-tauri; without this, video tests fall back
        # to system PATH ffmpeg which doesn't exist on CI runners.
        run: |
          case "$(uname -s)" in
            Darwin)  echo "MEDIA_BATCH_FFMPEG=binaries/ffmpeg-aarch64-apple-darwin"  >> "$GITHUB_ENV"
                     echo "MEDIA_BATCH_FFPROBE=binaries/ffprobe-aarch64-apple-darwin" >> "$GITHUB_ENV" ;;
            MINGW*|MSYS*|CYGWIN*)
                     echo "MEDIA_BATCH_FFMPEG=binaries/ffmpeg-x86_64-pc-windows-msvc.exe"  >> "$GITHUB_ENV"
                     echo "MEDIA_BATCH_FFPROBE=binaries/ffprobe-x86_64-pc-windows-msvc.exe" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported OS for ffmpeg env" >&2 ;;
          esac

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Tauri build (production profile check)
        working-directory: src-tauri
        # custom-protocol makes cargo build behave like `tauri build` (embeds
        # the frontend assets instead of pointing at the dev server).
        run: cargo build --release --features tauri/custom-protocol

  real-app-e2e:
    # WebdriverIO embedded-driver E2E against the real macOS binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend install
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg sidecars
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build E2E binary (dev frontend + release with wdio)
        run: pnpm e2e:real:build

      - name: Run real-app E2E
        run: pnpm test:e2e:real
