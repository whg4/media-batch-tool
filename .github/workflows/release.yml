name: Release

# Trigger manually or via tag v* (a tag push creates a GitHub Release with
# signed installers + latest.json so in-app auto-update works end-to-end).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Fetch ffmpeg sidecars
        run: bash scripts/fetch-ffmpeg.sh

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & bundle (Tauri)
        working-directory: src-tauri
        # pnpm tauri = @tauri-apps/cli (devDependency). `tauri build` builds in
        # release mode by default (no --release flag) and runs the
        # beforeBuildCommand (pnpm build) itself. Updater artifacts are signed
        # later in the release job via scripts/make-latest-json.sh.
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          # `tauri build --target <triple>` outputs under target/<triple>/release
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  release:
    # Validates the full chain on workflow_dispatch too (sign + latest.json,
    # artifact uploaded); only a tag push actually creates the GitHub Release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps (provides @tauri-apps/cli signer)
        run: pnpm install --frozen-lockfile

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Write updater signing key
        # printf does not add a trailing newline (echo does), and we strip any
        # line breaks in the stored secret — the minisign base64 decoder
        # rejects them ("Invalid symbol 10").
        run: printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n' > /tmp/updater.key

      - name: Sign installers & generate latest.json
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # dispatch dry-run: use the version from tauri.conf.json
            VERSION="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          DMG="$(find bundles -name '*.dmg' | head -1)"
          EXE="$(find bundles -name '*setup.exe' | head -1)"
          bash scripts/make-latest-json.sh \
            --key /tmp/updater.key \
            --version "$VERSION" \
            --url-prefix "https://github.com/${{ github.repository }}/releases/latest/download" \
            --out bundles/latest.json \
            --notes "媒体批处理工具 v${VERSION} 发布版（全功能免费）" \
            "$DMG" "$EXE"

      - name: Upload latest.json (manifest check on dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: bundles/latest.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bundles/latest.json \
            $(find bundles -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.sig') \
            --title "媒体批处理工具 v${GITHUB_REF_NAME#v}" \
            --notes "全功能免费 · 智能瘦身 / 格式转换 / 社交媒体适配 · 本地处理不上传"
        env:
          GH_TOKEN: ${{ github.token }}
