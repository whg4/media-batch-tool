<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="0.5" stop-color="#2f86f6"/>
      <stop offset="1" stop-color="#1448b8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="top"><rect x="56" y="56" width="912" height="456" rx="220"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a2a66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- base -->
  <rect x="56" y="56" width="912" height="912" rx="220" fill="#123f8f"/>
  <rect x="56" y="56" width="912" height="912" rx="220" fill="url(#bg)"/>
  <!-- top gloss -->
  <rect x="56" y="56" width="912" height="912" rx="220" fill="url(#gloss)" clip-path="url(#top)"/>

  <!-- lightning bolt -->
  <g filter="url(#shadow)">
    <path d="M600 132 L296 556 H446 L424 888 L748 412 H606 Z" fill="#ffffff"/>
  </g>
  <path d="M600 132 L296 556 H446 L424 888 L748 412 H606 Z" fill="#ffffff"/>

  <!-- subtle photo-frame hint: two small rounded cards bottom-left -->
  <g>
    <rect x="200" y="720" width="128" height="96" rx="22" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="200" y="720" width="128" height="96" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>
    <circle cx="236" cy="756" r="14" fill="#ffffff" fill-opacity="0.7"/>
    <path d="M216 792 L268 748 L296 776 L320 756" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
