[package]
name = "media-batch-tool"
version = "0.1.0"
description = "多合一媒体批处理工具：智能瘦身、格式转换、社交媒体适配"
authors = ["whg4 <liuweihua@infinitestar.net>"]
edition = "2021"

[lib]
name = "media_batch_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# All unit tests live in src/lib.rs modules and are compiled into the explicit
# `lib_tests` integration target (which carries the Windows Common Controls v6
# manifest needed to run Tauri test binaries on Windows). Disabling the implicit
# lib test harness avoids running the suite twice; `cargo test --test lib_tests`
# runs exactly the same tests.
test = false

[features]
default = []
# Enables the WebdriverIO test plugins (embedded WebDriver). Only used for the
# real-app E2E build: pnpm build:dev && cargo build --release --features wdio
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
base64 = "0.22"
minisign-verify = "0.2"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# WDIO test-only plugins (embedded WebDriver + execute/mock API). They are
# optional deps behind the `wdio` feature so production/release builds never
# link or start the WebDriver server. Enable with: cargo build --features wdio
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "hdr"] }
imageproc = "0.25"
ab_glyph = "0.2"
webp = "0.3"
tokio = { version = "1", features = ["full"] }
rayon = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
walkdir = "2"
anyhow = "1"

[[test]]
name = "lib_tests"
path = "src/lib.rs"
