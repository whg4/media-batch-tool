[package]
name = "media-batch-tool"
version = "0.1.0"
description = "多合一媒体批处理工具：智能瘦身、格式转换、社交媒体适配"
authors = ["weihualau"]
edition = "2021"

[lib]
name = "media_batch_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "hdr"] }
imageproc = "0.25"
ab_glyph = "0.2"
webp = "0.3"
tokio = { version = "1", features = ["full"] }
rayon = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
walkdir = "2"
anyhow = "1"
